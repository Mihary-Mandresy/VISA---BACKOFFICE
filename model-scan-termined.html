<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan terminé</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }

        .success-icon {
            font-size: 50px;
            color: #28a745;
            margin-bottom: 10px;
        }

        h1 {
            margin: 10px 0;
            font-size: 22px;
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        ul {
            list-style: none;
            padding: 0;
            text-align: left;
        }

        ul li {
            background: #f1f3f5;
            margin: 5px 0;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="success-icon">✔</div>

    <h1>Félicitations 🎉</h1>
    <p>Le scan des dossiers est terminé avec succès.</p>

    <h3>Références des dossiers</h3>
    <ul>
        <li>REF-2026-0001</li>
        <li>REF-2026-0002</li>
        <li>REF-2026-0003</li>
        <li>REF-2026-0004</li>
    </ul>

    <a href="#" class="btn">Retour</a>
</div>

</body>
</html>
